name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KEEP_RELEASES: 3

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      IS_RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Prepare signing key
        if: env.IS_RELEASE == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 is not set, the release will contain only the debug APK. See README."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release AAB
        if: env.IS_RELEASE != 'true' || env.SIGNING_KEYSTORE_PATH != ''
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Write Google Play texts
        if: env.IS_RELEASE == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Play listing plus "What's new" from the "Release notes" section of the merged PR,
          # attached to the release as a .txt file (see docs/releases.md).
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // {}' || echo '{}')
          export PR_TITLE=$(jq -r '.title // ""' <<<"$pr")
          export PR_BODY=$(jq -r '.body // ""' <<<"$pr")
          python3 .github/scripts/play_texts.py > "$RUNNER_TEMP/google-play.txt"
          cat "$RUNNER_TEMP/google-play.txt"

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/raspored-casova-$VERSION_NAME-debug.apk"
          if [ -n "$SIGNING_KEYSTORE_PATH" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/raspored-casova-$VERSION_NAME.aab"
          fi
          if [ -s "$RUNNER_TEMP/google-play.txt" ]; then
            cp "$RUNNER_TEMP/google-play.txt" "dist/raspored-casova-$VERSION_NAME-google-play.txt"
          fi
          gh release create "v$VERSION_NAME" dist/* \
            --target "$GITHUB_SHA" \
            --title "Raspored časova $VERSION_NAME" \
            --generate-notes

      - name: Keep only the latest releases
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[$KEEP_RELEASES:] | .[].tagName" |
          while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
