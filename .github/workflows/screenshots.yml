name: Screenshots

# Renders the app's main screens with sample data (app/src/test/.../ScreenshotTest.kt) and commits them to
# docs/screenshots on the same branch, so a change to the UI can be looked at without a phone.
on:
  push:
    branches: ['ccr-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Render screenshots
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*ScreenshotTest' -Pscreenshots

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then exit 0; fi
          # [skip ci] keeps this commit from starting the workflows again.
          git commit -m "Update screenshots [skip ci]"
          git push
